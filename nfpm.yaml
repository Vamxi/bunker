# RPM for bunker: the binary, its launcher, and its icons. `make rpm` stages
# the launcher and icons under target/pkgroot with `bunker install-desktop`,
# so they are the same files a source install writes.
name: bunker
arch: amd64
platform: linux
version: ${VERSION}
release: 1
maintainer: Vamsi <vamxikrishna95@gmail.com>
description: A fast GTK 4 terminal for Linux.
homepage: https://github.com/Vamxi/bunker
depends:
  # gtk-interface-color-scheme (follow the desktop's light/dark) is GTK 4.20.
  - gtk4 >= 4.20
  # Decodes inline images (PNG, JPEG, GIF).
  - gdk-pixbuf2
  - hicolor-icon-theme
contents:
  - src: target/release/bunker
    dst: /usr/bin/bunker
    file_info:
      mode: 0755
  - src: target/pkgroot/usr/share/applications/dev.bunker.Bunker.desktop
    dst: /usr/share/applications/dev.bunker.Bunker.desktop
  - src: target/pkgroot/usr/share/icons/hicolor/16x16/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/16x16/apps/dev.bunker.Bunker.png
  - src: target/pkgroot/usr/share/icons/hicolor/32x32/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/32x32/apps/dev.bunker.Bunker.png
  - src: target/pkgroot/usr/share/icons/hicolor/48x48/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/48x48/apps/dev.bunker.Bunker.png
  - src: target/pkgroot/usr/share/icons/hicolor/64x64/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/64x64/apps/dev.bunker.Bunker.png
  - src: target/pkgroot/usr/share/icons/hicolor/128x128/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/128x128/apps/dev.bunker.Bunker.png
  - src: target/pkgroot/usr/share/icons/hicolor/256x256/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/256x256/apps/dev.bunker.Bunker.png
  - src: target/pkgroot/usr/share/icons/hicolor/512x512/apps/dev.bunker.Bunker.png
    dst: /usr/share/icons/hicolor/512x512/apps/dev.bunker.Bunker.png
  - src: README.md
    dst: /usr/share/doc/bunker/README.md
  - src: CHANGELOG.md
    dst: /usr/share/doc/bunker/CHANGELOG.md
